<!DOCTYPE html>
<html lang="tr" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Sınıf Paneli - v4.0 Final (API & LocalStorage)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300 font-sans">

    <div id="modalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl border dark:border-gray-700">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black italic text-blue-600">Yeni Kayıt</h3>
                <button id="closeModal" class="text-gray-400 hover:text-red-500 text-3xl font-light">&times;</button>
            </div>
            <form id="studentForm" class="space-y-4">
                <input type="text" id="formAd" placeholder="Ad Soyad" required class="w-full p-4 rounded-2xl bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="formNo" placeholder="Okul No" required class="w-full p-4 rounded-2xl bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black shadow-lg shadow-blue-500/30">LİSTEYE EKLE</button>
            </form>
        </div>
    </div>

    <header class="p-6 border-b dark:border-gray-800 flex justify-between items-center max-w-6xl mx-auto">
        <div class="flex items-center gap-4">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-mono font-bold tracking-tighter italic">js_sinifi_<span class="text-blue-600">v4.final</span></h1>
        </div>
        <div class="flex gap-3">
            <button id="apiFetchBtn" class="px-4 py-2 rounded-xl border border-blue-600 text-blue-600 font-bold text-xs hover:bg-blue-600 hover:text-white transition-all">API'DEN ÖĞRENCİ ÇEK</button>
            <button id="openModal" class="px-4 py-2 rounded-xl bg-blue-600 text-white font-bold text-xs">+ YENİ</button>
            <button id="themeToggle" class="p-2 rounded-xl bg-gray-50 dark:bg-gray-800 border dark:border-gray-700">🌙</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
        <div class="mb-8 flex justify-between items-end">
            <div>
                <h2 class="text-3xl font-black italic uppercase tracking-tighter">Sınıf Listesi</h2>
                <span id="studentCount" class="text-[10px] font-bold bg-blue-600 text-white px-3 py-1 rounded-full uppercase">0 Kayıt</span>
            </div>
            <input type="text" id="searchInput" placeholder="Hızlı ara..." class="p-3 w-48 md:w-64 rounded-2xl bg-gray-50 dark:bg-gray-800 border dark:border-gray-700 outline-none text-sm">
        </div>

        <div id="studentGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        
        <div id="loader" class="hidden text-center py-20 animate-bounce font-mono text-blue-600 italic">API'den veriler çekiliyor...</div>
    </main>

    <script>
        // --- TEMEL ELEMENTLER ---
        const grid = document.getElementById('studentGrid');
        const countSpan = document.getElementById('studentCount');
        const loader = document.getElementById('loader');

        // --- LOCAL STORAGE & VERİ ---
        // Sayfa açıldığında hafızadaki veriyi al, yoksa boş dizi başlat
        let ogrenciler = JSON.parse(localStorage.getItem('sinifVerisi')) || [];

        function saveAndRender(liste = ogrenciler) {
            localStorage.setItem('sinifVerisi', JSON.stringify(ogrenciler));
            render(liste);
        }

        function render(liste = ogrenciler) {
            grid.innerHTML = "";
            countSpan.innerText = `${liste.length} ÖĞRENCİ`;

            liste.forEach((o, index) => {
                const card = document.createElement('div');
                card.className = "group bg-white dark:bg-gray-800 border dark:border-gray-700 p-6 rounded-[2.5rem] hover:shadow-2xl transition-all relative";
                card.innerHTML = `
                    <button onclick="deleteStudent(${index})" class="absolute top-4 right-4 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">✕</button>
                    <div class="w-24 h-24 mb-4 bg-gray-100 dark:bg-gray-900 rounded-full overflow-hidden mx-auto border-2 border-transparent group-hover:border-blue-500 transition-all">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${o.no}" class="w-full h-full object-cover">
                    </div>
                    <div class="text-center">
                        <h3 class="font-bold text-lg truncate">${o.adSoyad}</h3>
                        <p class="text-blue-500 font-mono text-sm font-bold tracking-widest mt-1">NO: ${o.no}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- FETCH API (Senaryo 3) ---
        async function fetchFromAPI() {
            loader.classList.remove('hidden');
            grid.classList.add('opacity-20');
            
            try {
                // Sadece isim çekmek için RandomUser API kullanıyoruz
                const response = await fetch('https://randomuser.me/api/?results=1');
                const data = await response.json();
                const user = data.results[0];

                const yeniOgrenci = {
                    adSoyad: `${user.name.first} ${user.name.last}`.toUpperCase(),
                    no: Math.floor(1000 + Math.random() * 9000).toString(), // Rastgele Okul No
                };

                ogrenciler.push(yeniOgrenci);
                saveAndRender();
            } catch (error) {
                alert("API hatası oluştu!");
            } finally {
                loader.classList.add('hidden');
                grid.classList.remove('opacity-20');
            }
        }

        // --- SİLME FONKSİYONU ---
        window.deleteStudent = (index) => {
            ogrenciler.splice(index, 1);
            saveAndRender();
        }

        // --- EVENT LISTENERS ---
        document.getElementById('apiFetchBtn').addEventListener('click', fetchFromAPI);
        
        document.getElementById('studentForm').addEventListener('submit', (e) => {
            e.preventDefault();
            ogrenciler.push({
                adSoyad: document.getElementById('formAd').value.toUpperCase(),
                no: document.getElementById('formNo').value
            });
            saveAndRender();
            document.getElementById('studentForm').reset();
            document.getElementById('modalOverlay').classList.add('hidden');
        });

        document.getElementById('openModal').onclick = () => document.getElementById('modalOverlay').classList.remove('hidden');
        document.getElementById('closeModal').onclick = () => document.getElementById('modalOverlay').classList.add('hidden');
        document.getElementById('themeToggle').onclick = () => document.getElementById('mainHtml').classList.toggle('dark');

        document.getElementById('searchInput').oninput = (e) => {
            const terim = e.target.value.toLowerCase();
            render(ogrenciler.filter(o => o.adSoyad.toLowerCase().includes(terim) || o.no.includes(terim)));
        };

        // İLK ÇALIŞTIRMA
        render();
    </script>
</body>
</html>
